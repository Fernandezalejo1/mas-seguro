name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El proyecto no tiene tests: el script "lint" es tsc --noEmit. Junto con el
      # build es lo unico verificable hoy.
      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
